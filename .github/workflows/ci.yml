name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --- Frontend: type-check + Jest ---
  # Rust tests aren't run here - cargo test is slow on GitHub-hosted runners
  # and is expected to be run locally before each release instead.
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: type-check
        run: npx tsc --noEmit

      - name: run frontend tests
        run: npm test
