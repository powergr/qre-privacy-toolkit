[package]
name = "qre-gui"
version = "2.8.0"
license = "MIT"
description = "QRE Privacy Toolkit"
authors = ["Project QRE"]
edition = "2021"

[lib]
name = "qre_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2.0.0"
tauri-plugin-os = "2"
data-encoding = "2.10"
toml = "1.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
totp-rs = "6.0"
zip = "2.3.0"
walkdir = "2"
aes-gcm = "0.10"
rand = "0.9"
rand_chacha = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
bincode = "1.3"
zstd = "0.13"
zeroize = { version = "1.7", features = ["derive"] }
anyhow = "1.0"
sysinfo = "0.39"
uuid = { version = "1.8", features = ["v4"] }
directories = "6.0"
argon2 = "0.5"
tauri-plugin-opener = "2"
qrcodegen = "1.8"
infer = "0.22"
rayon = "1.8"

# Clipboard monitoring (Desktop)
regex = "1"
chrono = "0.4"

# Metadata Cleaning Dependencies
exif = { package = "kamadak-exif", version = "0.6" }
img-parts = "0.4"
lopdf = "0.44"
id3 = "1.17"
lofty = "0.25"
ape = "0.6"
# Pixel decoding for the steganography detector (see cleaner/mod.rs::detect_steganography) —
# version pinned to match what tauri-plugin-clipboard-manager's `arboard` already resolves to,
# so this doesn't add a second copy of `image` to the dependency tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

# Windows specific dependency
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Add trash only for non-Android targets
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.6"

# Optimization profiles
[profile.dev.package."*"]
opt-level = 3

[features]
clipboard = []
# Exposes internal `crypto`/`keychain` modules so the fuzz crate (src-tauri/fuzz)
# can link against them. Never enabled in the shipped app.
fuzzing = []

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"
panic = "abort"
